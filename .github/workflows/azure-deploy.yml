name: Build and deploy MindAttic.Ideas to Azure App Service

# One build, two deployments of it (the same artifact on both):
#   mindattic             the company site
#   mindattic-ideas-demo  the public demo, re-provisioned by demo-reset.yml
#
# Stages, each gating the next:
#   build       restore, run the full NUnit suite, publish, generate the demo's idealist and the
#               idempotent migration script
#   migrate     apply that script to the company database and the demo TEMPLATE under an Entra token
#               (the running sites never do DDL)
#   deploy      push the artifact to the company site, restart it, and wait until THIS build reports
#               ready; only then the same to the demo (never both cold-starting on the one B1 core)
#   reset-demo  wipe and re-provision the demo, so it never runs new code on an old schema
#
# Everything authenticates with GitHub OIDC (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID).
# Prerequisite: ./infra/provision.ps1 -ResourceGroup rg-mindattic-ideas. Runbook: docs/DEPLOYMENT.md.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: 'Skip the migrate stage (schema already current)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write          # required by azure/login's OIDC flow

env:
  PUBLISH_PROJECT: src/MindAttic.Ideas.Blazor/MindAttic.Ideas.Blazor.csproj
  TEST_PROJECT: src/MindAttic.Ideas.Tests/MindAttic.Ideas.Tests.csproj
  MIGRATIONS_PROJECT: src/MindAttic.Ideas.Core
  AZURE_RESOURCE_GROUP: rg-mindattic-ideas
  DOTNET_VERSION: '10.x'

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Every MindAttic.* package is restored from the git-tracked lib/local-packages feed. A
      # GitHub runner has no C:\LocalNuGet and no ../local-feed; --ignore-failed-sources tells NuGet
      # to tolerate those two missing sources instead of hard-failing with NU1301, which is exactly
      # why the vendored copies have to be there.
      - name: Restore
        run: dotnet restore MindAttic.Ideas.slnx --ignore-failed-sources

      # The commit is stamped into the informational version, which /_health reports as X-Ideas-Version:
      # that is how the smoke test tells the new container from the one it is replacing.
      - name: Build
        run: dotnet build MindAttic.Ideas.slnx -c Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      # The deploy is gated on the suite. PageHistorySqlServerTests is [Explicit] and needs the dev
      # LocalDB, so it does not run here.
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.PUBLISH_PROJECT }} -c Release -o publish --no-build

      # The demo boots from this (Ideas:Idealist). Generated from the packages actually in the build,
      # so it can never list one that is not shipped.
      - name: Build the demo's idealist
        shell: pwsh
        run: ./tools/build-demo-idealist.ps1 -LibraryDir publish/library -Out publish/seed/demo.idealist

      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations script --idempotent `
            --project ${{ env.MIGRATIONS_PROJECT }} `
            --startup-project ${{ env.MIGRATIONS_PROJECT }} `
            --configuration Release --no-build `
            --output migrate.sql

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ideas-app
          path: publish/

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: ideas-migration
          path: migrate.sql

  migrate:
    runs-on: windows-2025
    needs: build
    if: ${{ !inputs.skip_migrate }}
    steps:
      - name: Download migration script
        uses: actions/download-artifact@v8
        with:
          name: ideas-migration

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A GitHub-hosted runner has no stable egress IP, so the rule is created for this run's IP
      # and torn down in the always() step below, whatever happens in between.
      - name: Open the SQL firewall for this runner
        id: firewall
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod 'https://api.ipify.org?format=json').ip
          $rule = "gh-$($env:GITHUB_RUN_ID)"
          $server = az sql server list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv
          az sql server firewall-rule create --resource-group ${{ env.AZURE_RESOURCE_GROUP }} `
            --server $server --name $rule --start-ip-address $ip --end-ip-address $ip --output none
          "rule=$rule"     | Out-File $env:GITHUB_OUTPUT -Append
          "server=$server" | Out-File $env:GITHUB_OUTPUT -Append
          "fqdn=$(az sql server show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $server --query fullyQualifiedDomainName -o tsv)" | Out-File $env:GITHUB_OUTPUT -Append

      # The company database, and the demo's template (the demo's live database is a copy of it,
      # replaced by reset-demo below).
      - name: Apply the schema
        shell: pwsh
        run: |
          # The runner image usually ships SqlServer; the PowerShell Gallery intermittently "finds no
          # match" for it, so install only if missing, with retries.
          for ($i = 1; -not (Get-Module -ListAvailable -Name SqlServer); $i++) {
            try { Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop }
            catch { if ($i -ge 4) { throw }; Write-Host "SqlServer install attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
          }
          Import-Module SqlServer
          $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
          foreach ($db in @('MindAtticIdeas', 'MindAtticIdeasDemoTemplate')) {
            Invoke-Sqlcmd -ServerInstance '${{ steps.firewall.outputs.fqdn }}' -Database $db `
              -AccessToken $token -InputFile migrate.sql -QueryTimeout 300 -ErrorAction Stop
            Write-Host "Schema applied to $db."
          }

      - name: Close the SQL firewall
        if: always() && steps.firewall.outputs.rule != ''
        shell: pwsh
        run: |
          az sql server firewall-rule delete --resource-group ${{ env.AZURE_RESOURCE_GROUP }} `
            --server '${{ steps.firewall.outputs.server }}' --name '${{ steps.firewall.outputs.rule }}' --output none

  # The company site first, then the demo. Two .NET cold starts on the shared single-core B1 plan pin
  # the CPU for minutes, and that contention is what made Entra SQL logins fail mid-handshake during
  # boot (exit 134 loops, docs/DEPLOYMENT.md). The demo goes second whatever the company result, so a
  # bad company deploy never strands the demo on an old build.
  deploy-company:
    runs-on: windows-2025
    needs: [build, migrate]
    # Deploy even when migrate was skipped, but never when it ran and failed: shipping code against
    # a schema that did not apply is how you get a half-migrated production database.
    if: ${{ always() && needs.build.result == 'success' && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' }}
    environment:
      name: production
      url: https://mindattic.azurewebsites.net
    env:
      APP: mindattic
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ideas-app
          path: publish/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          package: publish/

      # The zip deploy overwrites DLLs in /home/site/wwwroot underneath the RUNNING process. Linux
      # allows that (Windows would lock the files), and the old process then reads changed bytes
      # through its memory-mapped assemblies: every page throws BadImageFormatException while
      # /_health -- which touches none of that code -- still answers 200. Restart onto the new files.
      - name: Restart onto the new build
        shell: pwsh
        run: az webapp restart --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $env:APP

      # /_health answers as soon as the server listens, before initialisation; its headers say which
      # build is running (X-Ideas-Version carries the commit) and whether it has finished initialising
      # (X-Ideas-Ready). Wait for THIS commit to report ready -- the old container keeps answering until
      # the new one is up, so a bare 200 proves nothing -- then require the home page.
      - name: Smoke-test health and the home page
        shell: pwsh
        run: |
          $base = "https://$env:APP.azurewebsites.net"
          $sha = '${{ github.sha }}'
          $deadline = (Get-Date).AddMinutes(20)
          $ready = $false
          while (-not $ready -and (Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "$base/_health" -UseBasicParsing -TimeoutSec 30
              $version = "$($r.Headers['X-Ideas-Version'])"; $isReady = "$($r.Headers['X-Ideas-Ready'])"
              if ($version -like "*$sha*" -and $isReady -eq 'true') { $ready = $true; Write-Host "/_health: this build ($version) is ready." }
              else { Write-Host "/_health: $($r.StatusCode), version '$version', ready '$isReady'." }
            } catch { Write-Host "/_health: $($_.Exception.Message)" }
            if (-not $ready) { Start-Sleep -Seconds 15 }
          }
          if (-not $ready) { throw "$base never reported build $sha ready within 20 minutes." }
          $ok = $false
          for ($i = 1; $i -le 10 -and -not $ok; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 60
              if ($r.StatusCode -eq 200) { Write-Host "/ OK after $i attempt(s)."; $ok = $true }
            } catch { Write-Host "/ attempt $i : $($_.Exception.Message)" }
            if (-not $ok) { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { throw "$base/ never returned 200." }

  # The demo is smoke-tested properly by reset-demo, which stops and re-provisions it right after.
  deploy-demo:
    runs-on: windows-2025
    needs: [build, migrate, deploy-company]
    if: ${{ always() && needs.build.result == 'success' && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' && needs.deploy-company.result != 'cancelled' }}
    environment:
      name: production
      url: https://mindattic-ideas-demo.azurewebsites.net
    env:
      APP: mindattic-ideas-demo
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ideas-app
          path: publish/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          package: publish/

      # As above: never leave the old process running on overwritten DLLs.
      - name: Restart onto the new build
        shell: pwsh
        run: az webapp restart --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $env:APP

  reset-demo:
    needs: deploy-demo
    if: ${{ always() && needs.deploy-demo.result == 'success' }}
    uses: ./.github/workflows/demo-reset.yml
    secrets: inherit
